[project]
name = "promptli"
version = "0.2.0"
description = "Python SDK and CLI for Promptli Comms: email, SMS and phone calls for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Promptli" }]
keywords = ["ai-agents", "email", "sms", "voice", "telephony", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic[email]>=2.7",
    "websockets>=13",
    # The `promptli` command ships with the package, so its deps are not optional.
    "typer>=0.15",
    "rich>=13",
]

[project.optional-dependencies]
cli = []  # kept so existing `promptli[cli]` installs keep working

[project.urls]
Homepage = "https://comms.promptli.com"
Documentation = "https://comms.promptli.com/docs"
Repository = "https://github.com/promptli-dev/promptli-comms"
Issues = "https://github.com/promptli-dev/promptli-comms/issues"

[project.scripts]
promptli = "promptli.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["promptli"]
