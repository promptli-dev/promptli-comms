[project]
name = "promptli"
version = "0.1.0"
description = "Python SDK and CLI for Promptli Comms: email, SMS and phone calls for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic[email]>=2.7",
    "websockets>=13",
]

[project.optional-dependencies]
cli = ["typer>=0.15", "rich>=13"]

[project.scripts]
promptli = "promptli.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["promptli"]
