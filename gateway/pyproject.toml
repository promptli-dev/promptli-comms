[project]
name = "promptli-gateway"
version = "0.1.0"
description = "Runtime-agnostic plugin core for Promptli Comms (Agent Link, sessions, setup, doctor)"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["promptli", "mcp>=1.20"]

[project.scripts]
promptli-agent = "promptli_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["promptli_gateway"]
